<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin — Status ordinacije (simple pass, tolerant date)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<style>
  :root { color-scheme: light dark; }
  body { background:#000; color:#fff; font-family: system-ui, Arial, sans-serif; margin:0; }
  header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px; border-bottom:1px solid #222; }
  main { max-width: 900px; margin: 0 auto; padding: 16px; }
  a, .link { color:#4ade80; text-decoration: none; }
  .card { background:#0b0b0b; border:1px solid #222; border-radius:14px; padding:16px; margin:12px 0; }
  .row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:8px 0; }
  label { font-size:14px; opacity:.9; }
  input[type="password"], input[type="text"], input[type="time"] {
    background:#000; color:#fff; border:1px solid #333; border-radius:10px; padding:8px 10px;
  }
  input[type="checkbox"] { transform: scale(1.2); }
  .btn { background:#4ade80; color:#000; border:none; border-radius:10px; padding:10px 14px; font-weight:800; cursor:pointer; }
  .btn.secondary { background:#1a1a1a; color:#fff; border:1px solid #333; }
  .muted { opacity:.75; font-size:13px; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width: 760px){ .two{ grid-template-columns:1fr; } }
  table { width:100%; border-collapse: collapse; }
  th, td { padding:8px; border-bottom:1px solid #222; text-align:left; }
  .chip { display:inline-block; padding:2px 8px; border-radius:999px; background:#141414; border:1px solid #333; font-size:12px; }
  #msg { min-height:20px; font-size:13px; margin-top:6px; }
  .ok { color:#4ade80; } .err { color:#ff6b6b; }

  /* Gate */
  #gate { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(0,0,0,.9); z-index: 50; }
  #gate .box { background:#0b0b0b; border:1px solid #222; border-radius:14px; padding:18px; width:min(92vw, 380px); }
</style>
</head>
<body>
<header>
  <div><strong>Admin — Status ordinacije</strong></div>
  <nav><a class="link" href="/">← Nazad na sajt</a></nav>
</header>

<!-- Simple password gate -->
<div id="gate" aria-hidden="false">
  <div class="box">
    <h2>Pristup</h2>
    <div class="row">
      <label for="pwd" style="min-width:120px;">Lozinka:</label>
      <input id="pwd" type="password" placeholder="Unesite lozinku" />
      <button id="unlock" class="btn">Otvori</button>
    </div>
    <p class="muted">Napomena: ovo je samo osnovna zaštita na klijentu.</p>
    <div id="msg" class="err"></div>
  </div>
</div>

<main>
  <section id="formCard" class="card" style="display:none;">
    <div class="row" style="justify-content:space-between;">
      <h2>Podesi radno vrijeme</h2>
      <a class="link" href="#" id="btnLogout">Odjava</a>
    </div>

    <div class="two">
      <div>
        <div class="row">
          <label for="dateInput" style="min-width:120px;">Datum:</label>
          <input id="dateInput" type="text" placeholder="YYYY-MM-DD ili 16.08.2025 ili 08/16/2025" />
        </div>

        <div class="row">
          <label><input type="checkbox" id="closed" /> Neradni dan</label>
        </div>

        <div id="timeRow" class="row">
          <label for="startTime" style="min-width:120px;">Od:</label>
          <input type="time" id="startTime" value="10:00" />
          <label for="endTime" style="min-width:60px;">Do:</label>
          <input type="time" id="endTime" value="20:00" />
        </div>

        <div class="row">
          <button id="btnSave" class="btn">Sačuvaj izuzetak</button>
          <button id="btnDelete" class="btn secondary">Obriši izuzetak</button>
        </div>
      </div>

      <div>
        <h3>Sačuvani izuzeci</h3>
        <table id="tbl">
          <thead><tr><th>Datum</th><th>Status</th><th>Detalj</th><th>Akcija</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/sr.js"></script>
<script>
(function(){
  const FIXED_PASSWORD = "1234";
  const FUNCTIONS_BASE = "/.netlify/functions/overrides";
  const ISO = /^\\d{4}-\\d{2}-\\d{2}$/;
  const $ = (s)=>document.querySelector(s);

  function pad2(x){return String(x).padStart(2,'0');}
  function fmtDateISO(d){return d?`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`:'';}

  // Accept multiple formats: YYYY-MM-DD, DD.MM.YYYY (with or w/o trailing dot), DD/MM/YYYY, MM/DD/YYYY
  function toISOFlexible(input){
    if (!input) return "";
    const s = String(input).trim();
    if (ISO.test(s)) return s;

    // DD.MM.YYYY or DD.MM.YYYY.
    let m = s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})\.?$/);
    if (m) {
      const d = parseInt(m[1],10), mo=parseInt(m[2],10), y=parseInt(m[3],10);
      if (d>=1&&d<=31 && mo>=1&&mo<=12) return `${y}-${pad2(mo)}-${pad2(d)}`;
    }
    // DD/MM/YYYY
    m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if (m) {
      const d = parseInt(m[1],10), mo=parseInt(m[2],10), y=parseInt(m[3],10);
      if (d>=1&&d<=31 && mo>=1&&mo<=12) return `${y}-${pad2(mo)}-${pad2(d)}`;
    }
    // MM/DD/YYYY (fallback: if first part > 12 we interpret as DD/MM; else assume MM/DD)
    m = s.match(/^(\d{1,2})-(\d{1,2})-(\d{4})$/);
    if (m) {
      const a=parseInt(m[1],10), b=parseInt(m[2],10), y=parseInt(m[3],10);
      if (a>12 && b<=12) return `${y}-${pad2(b)}-${pad2(a)}`; // DD-MM-YYYY
      if (a<=12 && b<=31) return `${y}-${pad2(a)}-${pad2(b)}`; // MM-DD-YYYY
    }
    return "";
  }

  function toMin(t){const [h,m]=String(t||'').split(':').map(Number);return (h||0)*60+(m||0);}
  function std(day){ if(day>=1&&day<=5) return {start:'10:00',end:'20:00',closed:false}; if(day===6) return {start:'10:00',end:'14:00',closed:false}; return {closed:true}; }
  function show(el, b){ el.style.display = b ? '' : 'none'; }

  // Gate
  const gate = $('#gate'), msg = $('#msg'), formCard = $('#formCard');
  const pwdInput = $('#pwd');
  $('#unlock').addEventListener('click', unlock);
  pwdInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') unlock(); });
  function unlock(){
    const val = (pwdInput.value||'').trim();
    if (val !== FIXED_PASSWORD) { msg.textContent = "Pogrešna lozinka."; return; }
    sessionStorage.setItem('adminkey', val);
    gate.setAttribute('aria-hidden','true');
    gate.style.display = 'none';
    show(formCard, true);
    initUI();
  }
  $('#btnLogout').addEventListener('click', (e)=>{
    e.preventDefault();
    sessionStorage.removeItem('adminkey');
    location.href = "/";
  });

  // API
  async function apiGet(date){ const q = date?`?date=${encodeURIComponent(date)}`:''; const r = await fetch(`${FUNCTIONS_BASE}${q}`); const j=await r.json().catch(()=>({})); if(!r.ok||j.error) throw new Error(j.error||('HTTP '+r.status)); return j; }
  async function apiPost(payload){ const key=sessionStorage.getItem('adminkey')||''; const r=await fetch(FUNCTIONS_BASE,{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':key},body:JSON.stringify(payload)}); const j=await r.json().catch(()=>({})); if(!r.ok||j.error) throw new Error(j.error||('HTTP '+r.status)); return j; }
  async function apiDel(date){ const key=sessionStorage.getItem('adminkey')||''; const r=await fetch(`${FUNCTIONS_BASE}?date=${encodeURIComponent(date)}`,{method:'DELETE',headers:{'x-admin-key':key}}); const j=await r.json().catch(()=>({})); if(!r.ok||j.error) throw new Error(j.error||('HTTP '+r.status)); return j; }

  // UI
  let fp;
  function initPicker(){
    if(window.flatpickr){
      fp = flatpickr('#dateInput', { dateFormat:'Y-m-d', altInput:true, altFormat:'d.m.Y', locale:flatpickr.l10ns.sr, disableMobile:true, defaultDate: fmtDateISO(new Date()), onChange: preloadSingle });
    } else {
      $('#dateInput').value = fmtDateISO(new Date());
    }
  }

  function getISO(){
    // Prefer flatpickr selected date (robust)
    if (fp && fp.selectedDates && fp.selectedDates.length) return fmtDateISO(fp.selectedDates[0]);
    // Otherwise, try input value and coerce
    const raw = $('#dateInput').value;
    const iso = toISOFlexible(raw);
    return iso;
  }

  async function preloadSingle(){
    const iso = getISO(); if(!ISO.test(iso)) return;
    try{ const j = await apiGet(iso); const rec = j && j[iso]; fillForm(rec || std(new Date(iso+'T00:00:00').getDay())); }catch{ /*ignore*/ }
  }
  async function preload(){ try{ const all = await apiGet(); renderTable(all||{}); await preloadSingle(); } catch(e){ renderTable({}); /* ignore */ } }

  function fillForm(rec){ const c = !!rec?.closed; $('#closed').checked = c; $('#timeRow').style.display = c?'none':'flex'; if(!c){ $('#startTime').value = rec.start || '10:00'; $('#endTime').value = rec.end || '20:00'; } }
  $('#closed').addEventListener('change', ()=>{ $('#timeRow').style.display = $('#closed').checked ? 'none' : 'flex'; });

  $('#btnSave').addEventListener('click', async ()=>{
    const iso = getISO();
    if (!ISO.test(iso)) return alert('Izaberite datum (YYYY-MM-DD, DD.MM.YYYY ili MM/DD/YYYY).');
    const closed = $('#closed').checked;
    const payload = { date: iso, closed };
    if(!closed){
      const s=$('#startTime').value, e=$('#endTime').value;
      if(!s||!e) return alert('Unesite početak i kraj.');
      if(toMin(e)<=toMin(s)) return alert('Kraj mora biti poslije početka.');
      payload.start = s; payload.end = e;
    }
    try{ await apiPost(payload); alert('Sačuvano.'); await preload(); } catch(err){ alert(err.message||'Greška'); }
  });
  $('#btnDelete').addEventListener('click', async ()=>{
    const iso = getISO(); if(!ISO.test(iso)) return;
    try{ await apiDel(iso); alert('Izuzetak obrisan.'); await preload(); } catch(err){ alert(err.message||'Greška'); }
  });

  async function initUI(){
    initPicker();
    // Osiguraj da danas bude postavljen odmah
    setTimeout(preload, 10);
  }

  // Auto-open if već postoji ključ u sessionStorage
  (function boot(){
    const k = sessionStorage.getItem('adminkey');
    if (k === FIXED_PASSWORD) {
      gate.style.display = 'none';
      show(formCard, true);
      initUI();
    } else {
      show(formCard, false);
      gate.style.display = 'grid';
      $('#pwd').focus();
    }
  })();
})();
</script>
</body>
</html>
